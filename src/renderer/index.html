<!doctype html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FleetDesk</title>
  <link rel="icon" href="../../assets/icon.png">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../node_modules/choices.js/public/assets/styles/choices.min.css">
  <link rel="stylesheet" href="../../node_modules/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><i class="bi bi-truck-front-fill"></i><span>FleetDesk</span></div>
      <nav id="navigation" class="nav flex-column gap-1"></nav>
    </aside>
    <main class="content">
      <div class="topbar">
        <div><h1 id="pageTitle">Übersicht</h1><p id="pageSubtitle" class="text-secondary mb-0">Kennzahlen und Warnungen</p></div>
        <span class="badge rounded-pill text-bg-primary">Lokal · SQLite</span>
      </div>
      <section id="view"></section>
    </main>
  </div>

  <div class="modal fade" id="recordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="modalTitle"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schliessen"></button></div>
      <form id="recordForm" class="modal-form"><div class="modal-body"><div id="formFields" class="row g-3"></div><div id="formHint" class="mt-3"></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Abbrechen</button><button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Speichern</button></div></form>
    </div></div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../node_modules/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="../../node_modules/leaflet/dist/leaflet.js"></script>
  <script src="format.js"></script>
  <script src="app.js"></script>
</body>
</html>
