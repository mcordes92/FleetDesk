name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Apply manual release version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          npm version $version --no-git-tag-version

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetDesk-Windows
          path: |
            installer/*.exe
            installer/*.blockmap
            installer/latest.yml
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: FleetDesk ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            installer/*.exe
            installer/*.blockmap
            installer/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
